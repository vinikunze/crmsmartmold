<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7F2" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tema antes de desenhar a página, para não piscar claro no modo escuro.
         A mesma regra está em src/lib/tema.ts, que cuida das mudanças depois. -->
    <script>
      (function () {
        var e = 'auto';
        try { e = localStorage.getItem('emdia:tema') || 'auto'; } catch (x) {}
        var escuro = e === 'escuro' || (e === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="em dia." />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- use-credentials: o Access exige o login até para ler o manifesto. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <title>em dia.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
