<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Formulário de teste</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="auth">
      <form class="auth-box" id="form" style="width:min(520px,100%)">
        <div class="brand"><div class="brand-mark">SM</div><div><div class="brand-name">Smart Mold</div><div class="brand-sub">Formulário de teste da landing page</div></div></div>
        <p class="muted small" style="margin:0">Simula o formulário do site. O envio cria um lead real no CRM (origem "teste").</p>
        <label class="field">Nome<input class="input" name="nome" required /></label>
        <label class="field">WhatsApp<input class="input" name="telefone" type="tel" required /></label>
        <label class="field">E-mail<input class="input" name="email" type="email" /></label>
        <label class="field">Cidade<input class="input" name="cidade" placeholder="Ex.: Paracatu" required /></label>
        <label class="field">Você é
          <select class="input" name="perfil" required>
            <option value="">Selecione…</option>
            <option>Construtora / empreiteira</option>
            <option>Revenda de materiais</option>
            <option>Prefeitura / órgão público</option>
            <option>Produtor rural</option>
            <option>Arquiteto / engenheiro</option>
            <option>Pessoa física (obra própria)</option>
          </select></label>
        <label class="field">Tipo de bloco
          <select class="input" name="produto">
            <option>Bloco de vedação 9 cm</option><option>Bloco de vedação 14 cm</option><option>Bloco estrutural 14 cm</option>
            <option>Bloco estrutural 19 cm</option><option>Canaleta</option><option>Não sei, preciso de orientação</option>
          </select></label>
        <label class="field">Quantos blocos você precisa?
          <select class="input" name="volume" required>
            <option value="">Selecione…</option><option>Até 1.000 blocos</option><option>1.000 a 3.000 blocos</option><option>3.000 a 10.000 blocos</option><option>Acima de 10.000 blocos</option>
          </select></label>
        <label class="field">Quando pretende comprar?
          <select class="input" name="prazo" required>
            <option value="">Selecione…</option><option>Imediato</option><option>Em até 30 dias</option><option>Em até 90 dias</option><option>Apenas pesquisando</option>
          </select></label>
        <label class="field">Mensagem<textarea class="input" name="mensagem" placeholder="Conte sobre sua obra"></textarea></label>
        <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px" />
        <button class="btn primary" type="submit">Solicitar orçamento</button>
        <div id="resultado" class="alert hidden" role="status"></div>
      </form>
    </div>
    <script src="/formulario-exemplo.js"></script>
  </body>
</html>
